[project]
name = "multi-agent-product-discovery-chef"
version = "0.1.0"
description = "Multi-agent product discovery assistant for the PantryPal case: EDA, agents, single-prompt baseline and evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.30",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pydantic>=2.9",
]

[project.scripts]
discovery-chef = "discovery_chef.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery_chef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside google-genai on Python 3.14; not our code.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
